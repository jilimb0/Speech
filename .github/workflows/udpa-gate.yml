name: 'UDPA Institutional Quality & Security Gate'

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  udpa-gate:
    name: 'UDPA Gate & Ed25519 ZK-Passport'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Advisory until the assay score reaches the 85 target.
      - name: Run UDPA Composite Gate
        uses: jilimb0/udpa-engine@v1
        with:
          target-path: '.'
          min-score: '85'
          stage: 'Scale'
          sarif-output: 'udpa-audit.sarif'
          passport-output: 'udpa-zk-passport.json'
          fail-on-breach: 'false'

      - name: Upload OASIS SARIF to GitHub Security Tab
        if: always() && hashFiles('udpa-audit.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'udpa-audit.sarif'

      - name: Archive Zero-Knowledge Passport
        if: hashFiles('udpa-zk-passport.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: udpa-zk-passport
          path: udpa-zk-passport.json
          if-no-files-found: ignore
